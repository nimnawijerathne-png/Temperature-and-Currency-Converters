<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter Client</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #4a0e2e 0%, #9d174d 50%, #ec4899 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }

    .container {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(74, 14, 46, 0.4);
        width: 440px;
        border: 1px solid #fbcfe8;
    }

    h2 {
        text-align: center;
        color: #831843;
        margin: 0 0 4px 0;
        font-size: 23px;
        font-weight: 700;
        white-space: nowrap;
    }

    .subtitle {
        text-align: center;
        color: #a78ba0;
        font-size: 13px;
        margin-bottom: 26px;
    }

    .section-label {
        color: #db2777;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.6px;
        margin-bottom: 10px;
        margin-top: 22px;
    }

    .auth-box {
        background-color: #fdf2f8;
        border-radius: 10px;
        padding: 16px;
    }

    .form-group { margin-bottom: 18px; }
    .form-group:last-child { margin-bottom: 0; }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #4a2c3a;
        font-size: 14px;
    }

    input, select {
        width: 100%;
        padding: 12px 14px;
        margin-top: 4px;
        border: 2px solid #fbcfe8;
        border-radius: 10px;
        font-size: 15px;
        color: #831843;
        background-color: #fff7fb;
        font-family: inherit;
    }

    input::placeholder {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        color: #d391ae;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #ec4899;
        box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
        background-color: #ffffff;
    }

    .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 8px;
    }

    button {
        border: none;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        padding: 13px;
        border-radius: 10px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        font-family: inherit;
    }

    .btn-primary {
        background: linear-gradient(135deg, #ec4899 0%, #cd1266 100%);
        color: white;
        flex: 1;
        box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
    }

    .btn-full {
        background-color: #fce7f3;
        color: #c38fa4;
        width: 100%;
        margin-top: 10px;
    }

    button:hover { transform: translateY(-2px); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45); }
    button:active { transform: translateY(0); }

    .output-box {
        margin-top: 22px;
        padding: 16px;
        background-color: #fdf2f8;
        border-radius: 10px;
        border-left: 4px solid #ec4899;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        color: #831843;
        min-height: 20px;
        max-height: 260px;
        overflow-y: auto;
    }

    .error-text { color: #dc2626; font-weight: 600; }
</style>
</head>
<body>

<div class="container">
    <h2>💱 Currency Converter</h2>
    <div class="subtitle">Spring Boot · Node Proxy · MongoDB</div>

    <div class="section-label">AUTHENTICATION</div>
    <div class="auth-box">
        <div class="form-group">
            <label for="apiKey">X-API-KEY</label>
            <input type="text" id="apiKey" placeholder="e.g. SUPER-SECRET-DEV-KEY-123">
        </div>
    </div>

    <div class="section-label">CONVERT CURRENCY</div>

    <div class="form-group">
        <label for="amountValue">Amount</label>
        <input type="number" id="amountValue" placeholder="e.g. 100">
    </div>

    <div class="form-group">
        <label for="currencyUnit">Currency</label>
        <select id="currencyUnit">
            <option value="USD">USD ($)</option>
            <option value="LKR">LKR (Rs)</option>
        </select>
    </div>

    <div class="btn-row">
        <button class="btn-primary" onclick="convertCurrency()">Convert &amp; Save</button>
    </div>

    <button class="btn-full" onclick="viewHistory()">View History</button>

    <div class="output-box" id="outputArea">Result will appear here...</div>
</div>

<script>
    function getApiKey() {
        return document.getElementById('apiKey').value.trim();
    }

    function showError(message) {
        document.getElementById('outputArea').innerHTML =
            '<span class="error-text">Error: ' + message + '</span>';
    }

    async function convertCurrency() {
        const valueInput = document.getElementById('amountValue').value;
        const currencyInput = document.getElementById('currencyUnit').value;
        const outputArea = document.getElementById('outputArea');
        const apiKey = getApiKey();

        if (!valueInput) {
            showError('Please enter a numeric amount.');
            return;
        }
        if (!apiKey) {
            showError('Please enter your X-API-KEY above.');
            return;
        }

        outputArea.textContent = 'Converting...';

        try {
            const response = await fetch(`/api/convert?value=${valueInput}&currency=${currencyInput}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-KEY': apiKey
                }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || data.message || `Server Error: ${response.status}`);
            }

            outputArea.textContent =
                'Conversion Successful!\n' +
                'ID: ' + data.id + '\n' +
                'Amount: ' + data.inputAmount + ' ' + data.inputCurrency + '\n' +
                'Result: ' + data.outputAmount.toFixed(2) + ' ' + data.outputCurrency + '\n' +
                'Timestamp: ' + data.timestamp;
        } catch (error) {
            showError(error.message);
        }
    }

    async function viewHistory() {
        const outputArea = document.getElementById('outputArea');
        const apiKey = getApiKey();

        if (!apiKey) {
            showError('Please enter your X-API-KEY above.');
            return;
        }

        outputArea.textContent = 'Loading history...';

        try {
            const response = await fetch('/api/history', {
                headers: { 'X-API-KEY': apiKey }
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || data.message || `Server Error: ${response.status}`);
            }

            if (data.length === 0) {
                outputArea.textContent = 'No records found yet.';
                return;
            }

            outputArea.textContent = data.map(log =>
                `${log.inputAmount} ${log.inputCurrency} -> ${log.outputAmount.toFixed(2)} ${log.outputCurrency}  (${log.timestamp})`
            ).join('\n');
        } catch (error) {
            showError(error.message);
        }
    }
</script>

</body>
</html>
